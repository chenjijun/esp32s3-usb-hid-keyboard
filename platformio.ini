; ============================================================================
;  PlatformIO 工程配置 —— ESP32-S3 无线键盘桥
; ----------------------------------------------------------------------------
;  用法（在项目根目录执行）：
;    pio run                 编译
;    pio run -t upload       编译 + 烧录（USB 口一般是 /dev/cu.usbmodem*）
;    pio device monitor     看串口日志（115200）
;    pio run -t clean        清理（编译缓存坏了、报奇怪的 g++ 错误时用）
;
;  说明：本工程不需要新建 main.cpp。PlatformIO 会把 `src_dir` 里的 .ino
;  自动转成 .cpp 再编译（见 pioino.py：合并 .ino、补 include、自动生成函数
;  原型），所以 esp32s3_ble_keyboard/esp32s3_ble_keyboard.ino 仍然是唯一
;  一份源码，Arduino IDE 和 PlatformIO 共用，不会出现两份代码不同步。
; ============================================================================

[platformio]
; 直接指向 Arduino IDE 的 sketch 目录
src_dir = esp32s3_ble_keyboard
default_envs = esp32s3

[env:esp32s3]
; 官方 platformio/espressif32 停在 Arduino 核心 2.0.17（ESP-IDF 4.4），
; 而本固件用了 3.x 才有的 BLE 3.x 与 USBHIDKeyboard 接口，
; 必须换成社区维护的 pioarduino 分支（当前 stable = Arduino 3.3.x / IDF 5.5）。
; 想锁版本就把 stable 换成具体 tag，例如 .../download/55.03.311/platform-espressif32.zip
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    colorize

; 关键：板型定义里默认 ARDUINO_USB_MODE=1（Hardware CDC and JTAG），
; 这一档没有 TinyUSB 栈，USBHIDKeyboard 链接不出来，编译会停在
; esp32s3_ble_keyboard.ino 的 #error 上。这里先撤掉板型的定义，再显式给 0：
;   ARDUINO_USB_MODE=0         -> USB-OTG (TinyUSB)，HID 可用
;   ARDUINO_USB_CDC_ON_BOOT=1  -> USB 口上额外挂一个 CDC 串口，能看 Serial 日志
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

; Flash / 分区：默认 8MB。模组是 16MB 的话打开下面两行（16MB 的默认分区表
; 会给 app 更大空间；要自定义请换 board_build.partitions 指向 csv）
;board_upload.flash_size = 16MB
;board_build.flash_size = 16MB

; 用了 PSRAM 的模组（N16R8 之类）打开：
;board_build.arduino.memory_type = qio_opi
;build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM

; 串口设备写死可以省掉 -p 参数，按实际情况改
;upload_port = /dev/cu.usbmodem1101
;upload_speed = 921600
